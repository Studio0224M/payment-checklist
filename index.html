<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>スマホ支払いチェックリスト</title>
<!-- ここからが追加された定型文です -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3b82f6">
<link rel="apple-touch-icon" href="icon.png">

<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js');
        });
    }
</script>
<!-- ここまで -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        /* Custom scrollbar hiding for smooth mobile feel */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen pb-24 selection:bg-brand-500 selection:text-white">

    <!-- App Container (Mobile viewport constrained for optimal phone view) -->
    <div class="max-w-md mx-auto min-h-screen bg-slate-50 shadow-xl flex flex-col relative">

        <!-- Header -->
        <header class="bg-indigo-700 text-white p-4 sticky top-0 z-30 shadow-md">
            <div class="flex justify-between items-center">
                <div class="flex items-center space-x-2">
                    <div class="w-9 h-9 rounded-xl bg-white/20 flex items-center justify-center backdrop-blur-sm">
                        <i class="fa-solid font-bold fa-receipt text-indigo-100 text-lg"></i>
                    </div>
                    <div>
                        <h1 class="text-lg font-bold leading-tight">支払いチェックリスト</h1>
                        <p class="text-xs text-indigo-200" id="current-month-display">2026年9月度</p>
                    </div>
                </div>
                <button id="btn-quick-add" onclick="openManualModal()" class="bg-white/15 hover:bg-white/25 active:scale-95 transition-all text-white p-2.5 rounded-full flex items-center justify-center shadow-sm" title="手動追加">
                    <i class="fa-solid fa-plus text-base"></i>
                </button>
            </div>

            <!-- Summary Stats Card -->
            <div class="mt-4 grid grid-cols-2 gap-2 bg-indigo-900/40 p-3 rounded-2xl backdrop-blur-md border border-white/10">
                <div class="p-2 rounded-xl bg-white/10">
                    <span class="text-xs text-indigo-200 block mb-0.5"><i class="fa-solid fa-clock text-amber-300 mr-1"></i>今月の未払い</span>
                    <span class="text-lg font-extrabold text-amber-300" id="stat-unpaid-amount">¥0</span>
                    <span class="text-[10px] text-indigo-200 block" id="stat-unpaid-count">0 件</span>
                </div>
                <div class="p-2 rounded-xl bg-white/10">
                    <span class="text-xs text-indigo-200 block mb-0.5"><i class="fa-solid fa-circle-check text-emerald-400 mr-1"></i>完了済み</span>
                    <span class="text-lg font-extrabold text-emerald-300" id="stat-paid-amount">¥0</span>
                    <span class="text-[10px] text-indigo-200 block" id="stat-paid-count">0 件</span>
                </div>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="p-4 flex-1 space-y-4">

            <!-- Camera / OCR Upload Banner -->
            <div class="bg-gradient-to-r from-indigo-600 to-purple-600 rounded-2xl p-4 text-white shadow-lg relative overflow-hidden">
                <div class="absolute -right-4 -bottom-4 opacity-15 text-7xl font-black text-white pointer-events-none">
                    <i class="fa-solid fa-camera"></i>
                </div>
                <div class="relative z-10">
                    <div class="flex items-center space-x-2 mb-1">
                        <span class="bg-amber-400 text-indigo-950 font-bold text-[10px] px-2 py-0.5 rounded-full uppercase tracking-wider">AI OCR搭載</span>
                        <h2 class="text-sm font-bold">請求書・払込書を撮影</h2>
                    </div>
                    <p class="text-xs text-indigo-100 mb-3 leading-relaxed">撮影・画像選択で金額や支払先、収納印（支払有無）を自動読み取り！</p>
                    
                    <div class="flex gap-2">
                        <!-- Camera capture input -->
                        <label class="flex-1 bg-white text-indigo-700 hover:bg-indigo-50 active:scale-98 transition-all font-bold text-xs py-2.5 px-3 rounded-xl shadow-md cursor-pointer flex items-center justify-center space-x-1.5">
                            <i class="fa-solid fa-camera text-base text-indigo-600"></i>
                            <span>撮影・読み取り</span>
                            <input type="file" id="camera-input" accept="image/*" capture="environment" class="hidden" onchange="handleImageUpload(event)">
                        </label>
                        
                        <!-- Test with sample invoice button -->
                        <button onclick="loadSampleInvoice()" class="bg-indigo-800/80 hover:bg-indigo-900 border border-indigo-400/40 text-indigo-100 active:scale-98 transition-all font-medium text-xs px-3 rounded-xl flex items-center justify-center space-x-1" title="添付サンプル画像でAI判定テスト">
                            <i class="fa-solid fa-vial text-amber-300"></i>
                            <span>サンプル試用</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Filter and Controls -->
            <div class="flex items-center justify-between pt-1">
                <div class="flex bg-slate-200/80 p-1 rounded-xl text-xs font-semibold text-slate-600 w-full">
                    <button id="filter-all" onclick="setFilter('all')" class="flex-1 py-1.5 rounded-lg text-center transition-all bg-white text-indigo-700 shadow-sm">すべて</button>
                    <button id="filter-unpaid" onclick="setFilter('unpaid')" class="flex-1 py-1.5 rounded-lg text-center transition-all">未払い</button>
                    <button id="filter-paid" onclick="setFilter('paid')" class="flex-1 py-1.5 rounded-lg text-center transition-all">支払い済み</button>
                </div>
            </div>

            <!-- Checklist Items List -->
            <div id="checklist-container" class="space-y-3">
                <!-- Dynamic cards injected via JS -->
            </div>

            <!-- Empty State -->
            <div id="empty-state" class="hidden text-center py-12 px-4">
                <div class="w-16 h-16 bg-slate-200 text-slate-400 rounded-full flex items-center justify-center mx-auto mb-3">
                    <i class="fa-solid fa-clipboard-check text-2xl"></i>
                </div>
                <h3 class="text-sm font-bold text-slate-600">該当する支払いはありません</h3>
                <p class="text-xs text-slate-400 mt-1">「撮影・読み取り」または右上「＋」ボタンから追加してください。</p>
            </div>

        </main>

        <!-- OCR Processing Overlay Modal -->
        <div id="ocr-loading-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
            <div class="bg-white rounded-3xl p-6 w-full max-w-xs text-center shadow-2xl space-y-4">
                <div class="relative w-16 h-16 mx-auto">
                    <div class="absolute inset-0 rounded-full border-4 border-indigo-200 animate-ping opacity-75"></div>
                    <div class="relative w-16 h-16 rounded-full bg-indigo-600 text-white flex items-center justify-center text-2xl shadow-lg">
                        <i class="fa-solid fa-wand-magic-sparkles animate-pulse"></i>
                    </div>
                </div>
                <div>
                    <h3 class="font-bold text-slate-800 text-base">請求書を解析中...</h3>
                    <p class="text-xs text-slate-500 mt-1">Gemini AIが項目、金額、収納印（支払状態）を読み取っています。</p>
                </div>
            </div>
        </div>

        <!-- Add/Edit Modal -->
        <div id="item-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 hidden">
            <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl p-5 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto">
                <div class="flex justify-between items-center border-b border-slate-100 pb-3">
                    <div class="flex items-center space-x-2">
                        <span id="modal-badge-ocr" class="hidden bg-purple-100 text-purple-700 text-[10px] font-bold px-2 py-0.5 rounded-md">AI自動抽出</span>
                        <h3 id="modal-title" class="font-bold text-slate-800 text-base">支払項目の入力</h3>
                    </div>
                    <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 w-8 h-8 rounded-full flex items-center justify-center bg-slate-100">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>

                <form id="payment-form" onsubmit="saveItem(event)" class="space-y-3">
                    <input type="hidden" id="form-id">

                    <!-- Title Item (e.g. 9月テレビ代) -->
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">項目名 <span class="text-red-500">*</span></label>
                        <input type="text" id="form-title" required placeholder="例: 9月テレビ代" class="w-full text-sm px-3.5 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-slate-50">
                    </div>

                    <!-- Payee -->
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">支払先 <span class="text-red-500">*</span></label>
                        <input type="text" id="form-payee" required placeholder="例: JCOMマーケティング株式会社" class="w-full text-sm px-3.5 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-slate-50">
                    </div>

                    <!-- Amount & Due Date Grid -->
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">金額 (円) <span class="text-red-500">*</span></label>
                            <input type="number" id="form-amount" required placeholder="2052" min="0" class="w-full text-sm px-3.5 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-slate-50">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">支払期限 <span class="text-red-500">*</span></label>
                            <input type="date" id="form-due-date" required class="w-full text-sm px-3.5 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-slate-50">
                        </div>
                    </div>

                    <!-- Payment Method -->
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">支払い方法</label>
                        <select id="form-method" class="w-full text-sm px-3.5 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-slate-50">
                            <option value="コンビニ (CVS)">コンビニ (CVS)</option>
                            <option value="Pay-easy (ペイジー)">Pay-easy (ペイジー)</option>
                            <option value="クレジットカード">クレジットカード</option>
                            <option value="口座振替">口座振替</option>
                            <option value="銀行振込">銀行振込</option>
                            <option value="スマホ決済 (PayPay等)">スマホ決済 (PayPay等)</option>
                            <option value="その他">その他</option>
                        </select>
                    </div>

                    <!-- Payment Status Checkbox -->
                    <div class="pt-2">
                        <label class="flex items-center space-x-3 p-3 rounded-xl border border-slate-200 bg-slate-50 cursor-pointer hover:bg-slate-100 transition-all">
                            <input type="checkbox" id="form-is-paid" onchange="togglePaidDateVisibility()" class="w-5 h-5 rounded border-slate-300 text-emerald-600 focus:ring-emerald-500">
                            <div class="flex-1">
                                <span class="text-xs font-bold text-slate-800 block">支払い済みとして記録</span>
                                <span class="text-[11px] text-slate-500">収納印や領収書が確認できたらチェック</span>
                            </div>
                        </label>
                    </div>

                    <!-- Paid Date Optional -->
                    <div id="paid-date-container" class="hidden">
                        <label class="block text-xs font-semibold text-slate-600 mb-1">支払い日</label>
                        <input type="date" id="form-paid-date" class="w-full text-sm px-3.5 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-slate-50">
                    </div>

                    <!-- Action Buttons -->
                    <div class="pt-3 flex gap-2">
                        <button type="button" onclick="closeModal()" class="flex-1 py-3 rounded-xl border border-slate-200 text-slate-600 text-xs font-bold hover:bg-slate-50">キャンセル</button>
                        <button type="submit" class="flex-1 py-3 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold shadow-md transition-all">保存する</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Toast Notification -->
        <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-800 text-white px-4 py-2.5 rounded-full text-xs font-medium shadow-xl flex items-center space-x-2 transition-all duration-300 opacity-0 pointer-events-none z-50">
            <i id="toast-icon" class="fa-solid fa-circle-check text-emerald-400"></i>
            <span id="toast-message">メッセージ</span>
        </div>

    </div>

    <script>
        // State Management
        let items = [];
        let currentFilter = 'all';

        // Sample base64 image representation for testing (mimicking user's uploaded bill)
        const SAMPLE_IMAGE_URL = 'スクリーンショット 2026-09-21 095123.jpg';

        // Initial Load
        window.addEventListener('DOMContentLoaded', () => {
            loadItems();
            render();
        });

        // Load items from localStorage
        function loadItems() {
            const saved = localStorage.getItem('payment_checklist_items');
            if (saved) {
                try {
                    items = JSON.parse(saved);
                } catch (e) {
                    items = [];
                }
            }
            
            // If empty, populate with default sample from the user prompt image
            if (!items || items.length === 0) {
                items = [
                    {
                        id: 'sample-1',
                        title: '9月 テレビ代 (JCOM)',
                        payee: 'JCOMマーケティング株式会社',
                        amount: 2052,
                        dueDate: '2026-09-30',
                        isPaid: true,
                        paidDate: '2026-09-19',
                        paymentMethod: 'コンビニ (CVS)',
                        createdAt: new Date().toISOString()
                    },
                    {
                        id: 'sample-2',
                        title: '9月 電気代',
                        payee: '関西電力株式会社',
                        amount: 6480,
                        dueDate: '2026-09-28',
                        isPaid: false,
                        paidDate: null,
                        paymentMethod: '口座振替',
                        createdAt: new Date().toISOString()
                    }
                ];
                saveToStorage();
            }
        }

        // Save items to localStorage
        function saveToStorage() {
            localStorage.setItem('payment_checklist_items', JSON.stringify(items));
        }

        // Filter Logic
        function setFilter(filter) {
            currentFilter = filter;
            ['all', 'unpaid', 'paid'].forEach(f => {
                const btn = document.getElementById(`filter-${f}`);
                if (f === filter) {
                    btn.className = "flex-1 py-1.5 rounded-lg text-center transition-all bg-white text-indigo-700 shadow-sm font-bold";
                } else {
                    btn.className = "flex-1 py-1.5 rounded-lg text-center transition-all text-slate-500 hover:text-slate-800";
                }
            });
            render();
        }

        // Toggle Payment Checkbox
        function togglePaidStatus(id, event) {
            if (event) event.stopPropagation();
            const item = items.find(i => i.id === id);
            if (item) {
                item.isPaid = !item.isPaid;
                if (item.isPaid && !item.paidDate) {
                    const today = new Date();
                    item.paidDate = today.toISOString().split('T')[0];
                }
                saveToStorage();
                render();
                showToast(item.isPaid ? '支払い済みに更新しました' : '未払いに変更しました');
            }
        }

        // Render Checklist UI
        function render() {
            const container = document.getElementById('checklist-container');
            const emptyState = document.getElementById('empty-state');
            container.innerHTML = '';

            // Filter items
            let filteredItems = items.filter(item => {
                if (currentFilter === 'unpaid') return !item.isPaid;
                if (currentFilter === 'paid') return item.isPaid;
                return true;
            });

            // Sort: Unpaid first (sorted by due date asc), then Paid (sorted by paid date desc)
            filteredItems.sort((a, b) => {
                if (a.isPaid !== b.isPaid) return a.isPaid ? 1 : -1;
                return new Date(a.dueDate) - new Date(b.dueDate);
            });

            // Update Statistics
            let unpaidTotal = 0, unpaidCount = 0;
            let paidTotal = 0, paidCount = 0;

            items.forEach(i => {
                if (i.isPaid) {
                    paidTotal += Number(i.amount);
                    paidCount++;
                } else {
                    unpaidTotal += Number(i.amount);
                    unpaidCount++;
                }
            });

            document.getElementById('stat-unpaid-amount').textContent = `¥${unpaidTotal.toLocaleString()}`;
            document.getElementById('stat-unpaid-count').textContent = `${unpaidCount} 件`;
            document.getElementById('stat-paid-amount').textContent = `¥${paidTotal.toLocaleString()}`;
            document.getElementById('stat-paid-count').textContent = `${paidCount} 件`;

            if (filteredItems.length === 0) {
                emptyState.classList.remove('hidden');
            } else {
                emptyState.classList.add('hidden');
            }

            filteredItems.forEach(item => {
                const isOverdue = !item.isPaid && new Date(item.dueDate) < new Date(new Date().setHours(0,0,0,0));
                
                const card = document.createElement('div');
                card.className = `bg-white rounded-2xl p-4 shadow-sm border transition-all duration-200 ${
                    item.isPaid 
                        ? 'border-slate-200/80 bg-slate-50/60' 
                        : isOverdue 
                            ? 'border-red-300 bg-red-50/30' 
                            : 'border-slate-200 hover:border-indigo-200'
                }`;

                card.innerHTML = `
                    <div class="flex items-start space-x-3">
                        <!-- Custom Touch-friendly Checkbox -->
                        <button onclick="togglePaidStatus('${item.id}', event)" class="mt-0.5 flex-shrink-0 w-7 h-7 rounded-xl flex items-center justify-center transition-all ${
                            item.isPaid 
                                ? 'bg-emerald-500 text-white shadow-sm ring-2 ring-emerald-200' 
                                : 'border-2 border-slate-300 hover:border-indigo-500 bg-white'
                        }">
                            ${item.isPaid ? '<i class="fa-solid fa-check text-sm font-bold"></i>' : ''}
                        </button>

                        <!-- Details -->
                        <div class="flex-1 min-w-0" onclick="openEditModal('${item.id}')">
                            <div class="flex items-center justify-between">
                                <h3 class="text-sm font-bold text-slate-800 truncate ${item.isPaid ? 'line-through text-slate-400' : ''}">
                                    ${escapeHtml(item.title)}
                                </h3>
                                <span class="text-sm font-extrabold ${item.isPaid ? 'text-slate-400' : 'text-slate-900'}">
                                    ¥${Number(item.amount).toLocaleString()}
                                </span>
                            </div>

                            <p class="text-xs text-slate-500 mt-0.5 truncate">
                                <i class="fa-solid fa-building text-[10px] mr-1 text-slate-400"></i>${escapeHtml(item.payee)}
                            </p>

                            <div class="flex flex-wrap items-center gap-1.5 mt-2.5">
                                <!-- Payment Method Badge -->
                                <span class="text-[10px] bg-slate-100 text-slate-600 px-2 py-0.5 rounded-md font-medium">
                                    ${escapeHtml(item.paymentMethod || '支払方法未設定')}
                                </span>

                                <!-- Status & Date Badge -->
                                ${item.isPaid ? `
                                    <span class="text-[10px] bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-md font-semibold flex items-center gap-1">
                                        <i class="fa-solid fa-circle-check"></i> ${item.paidDate ? formatDate(item.paidDate) + '済' : '支払い済み'}
                                    </span>
                                ` : isOverdue ? `
                                    <span class="text-[10px] bg-red-100 text-red-700 px-2 py-0.5 rounded-md font-bold flex items-center gap-1">
                                        <i class="fa-solid fa-triangle-exclamation"></i> 期限切れ (${formatDate(item.dueDate)})
                                    </span>
                                ` : `
                                    <span class="text-[10px] bg-amber-100 text-amber-800 px-2 py-0.5 rounded-md font-medium flex items-center gap-1">
                                        <i class="fa-regular fa-clock"></i> 期限: ${formatDate(item.dueDate)}
                                    </span>
                                `}
                            </div>
                        </div>

                        <!-- Options Dropdown/Delete Button -->
                        <button onclick="deleteItem('${item.id}', event)" class="text-slate-300 hover:text-red-500 p-1.5 rounded-lg transition-colors text-xs" title="削除">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </div>
                `;

                container.appendChild(card);
            });
        }

        // Handle User Image Upload (Camera or File)
        async function handleImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            showOcrLoading(true);

            try {
                // Convert file to Base64
                const base64Data = await fileToBase64(file);
                const result = await callGeminiOCR(base64Data, file.type);
                showOcrLoading(false);

                if (result) {
                    openModalWithOcrResult(result);
                } else {
                    showToast('画像の解析に失敗しました。手動で入力してください。', 'error');
                }
            } catch (err) {
                console.error(err);
                showOcrLoading(false);
                showToast('エラーが発生しました', 'error');
            }

            // Reset input
            event.target.value = '';
        }

        // Sample invoice testing directly with prompt provided sample context
        async function loadSampleInvoice() {
            showOcrLoading(true);
            
            // Simulating image OCR processing for the sample bill provided in user's prompt
            setTimeout(() => {
                showOcrLoading(false);
                
                // OCR parsed result from user's attached invoice:
                // 2026年9月, JCOMマーケティング株式会社, 2,052円, 2026年9月30日, 収納印 9/19
                const sampleResult = {
                    title: '9月 テレビ代 (JCOM)',
                    payee: 'JCOMマーケティング株式会社',
                    amount: 2052,
                    dueDate: '2026-09-30',
                    isPaid: true,
                    paidDate: '2026-09-19',
                    paymentMethod: 'コンビニ (CVS)'
                };

                openModalWithOcrResult(sampleResult);
                showToast('サンプル画像のOCR判定が完了しました');
            }, 1200);
        }

        // Call Gemini 3 Flash Preview API for Multimodal OCR
        async function callGeminiOCR(base64Data, mimeType) {
            const apiKey = ""; // Automatic runtime insertion in Canvas
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

            const systemPrompt = `あなたは請求書や払込通帳・払込取扱票の画像から、支払い用管理データを正確に読み取るAIです。
以下のルールに従って情報を取り出し、JSON形式でのみ出力してください。

1. 氏名（個人名など）は絶対に含めないでください。
2. title: ご請求月（例: 2026年9月）とサービス/受取人（例: JCOM）から「〇月 テレビ代」や「9月 JCOM利用料」のような簡潔な項目名を付けてください。
3. payee: 受取人または支払先企業名（例: JCOMマーケティング株式会社）
4. amount: ご請求金額（カンマを除いた半角数値。例: 2052）
5. dueDate: お支払い期限（YYYY-MM-DD形式。例: 2026-09-30）
6. isPaid: 画像内に「収納印」「領収印」「受領スタンプ」または手書きの日付メモ（例: 「9/19」や「領収」）が存在する場合は true、何も印や書き込みがない場合は false にしてください。
7. paidDate: 収納印等から読み取れる日付（YYYY-MM-DD形式）。請求月が2026年9月で手書きが「9/19」なら「2026-09-19」。判別不可なら null。
8. paymentMethod: 支払用紙のタイプ（コンビニ (CVS), Pay-easy (ペイジー), 銀行振込 など）`;

            const payload = {
                contents: [
                    {
                        role: "user",
                        parts: [
                            { text: "この請求書/払込票の画像をOCR解析してJSONデータで回答してください。" },
                            {
                                inlineData: {
                                    mimeType: mimeType || "image/jpeg",
                                    data: base64Data
                                }
                            }
                        ]
                    }
                ],
                generationConfig: {
                    responseMimeType: "application/json"
                },
                systemInstruction: {
                    parts: [{ text: systemPrompt }]
                }
            };

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) throw new Error(`API error: ${response.status}`);

                const data = await response.json();
                const jsonText = data.candidates?.[0]?.content?.parts?.[0]?.text;
                if (jsonText) {
                    return JSON.parse(jsonText);
                }
            } catch (e) {
                console.error("Gemini API OCR failed:", e);
            }
            return null;
        }

        // Form & Modal Management
        function openManualModal() {
            document.getElementById('modal-badge-ocr').classList.add('hidden');
            document.getElementById('modal-title').textContent = '支払項目を手動追加';
            document.getElementById('payment-form').reset();
            document.getElementById('form-id').value = '';
            
            // Set default due date to end of current month
            const today = new Date();
            const lastDay = new Date(today.getFullYear(), today.getMonth() + 1, 0);
            document.getElementById('form-due-date').value = lastDay.toISOString().split('T')[0];
            
            togglePaidDateVisibility();
            document.getElementById('item-modal').classList.remove('hidden');
        }

        function openModalWithOcrResult(ocrData) {
            document.getElementById('modal-badge-ocr').classList.remove('hidden');
            document.getElementById('modal-title').textContent = 'OCR読み取り結果の確認';
            document.getElementById('form-id').value = '';

            document.getElementById('form-title').value = ocrData.title || '';
            document.getElementById('form-payee').value = ocrData.payee || '';
            document.getElementById('form-amount').value = ocrData.amount || '';
            document.getElementById('form-due-date').value = ocrData.dueDate || '';
            document.getElementById('form-method').value = ocrData.paymentMethod || 'コンビニ (CVS)';
            
            const isPaidCheckbox = document.getElementById('form-is-paid');
            isPaidCheckbox.checked = !!ocrData.isPaid;
            
            const paidDateInput = document.getElementById('form-paid-date');
            if (ocrData.paidDate) {
                paidDateInput.value = ocrData.paidDate;
            } else if (ocrData.isPaid) {
                paidDateInput.value = new Date().toISOString().split('T')[0];
            }

            togglePaidDateVisibility();
            document.getElementById('item-modal').classList.remove('hidden');
        }

        function openEditModal(id) {
            const item = items.find(i => i.id === id);
            if (!item) return;

            document.getElementById('modal-badge-ocr').classList.add('hidden');
            document.getElementById('modal-title').textContent = '支払項目の編集';
            
            document.getElementById('form-id').value = item.id;
            document.getElementById('form-title').value = item.title;
            document.getElementById('form-payee').value = item.payee;
            document.getElementById('form-amount').value = item.amount;
            document.getElementById('form-due-date').value = item.dueDate;
            document.getElementById('form-method').value = item.paymentMethod || 'コンビニ (CVS)';
            document.getElementById('form-is-paid').checked = item.isPaid;
            document.getElementById('form-paid-date').value = item.paidDate || '';

            togglePaidDateVisibility();
            document.getElementById('item-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('item-modal').classList.add('hidden');
        }

        function togglePaidDateVisibility() {
            const isChecked = document.getElementById('form-is-paid').checked;
            const container = document.getElementById('paid-date-container');
            if (isChecked) {
                container.classList.remove('hidden');
                if (!document.getElementById('form-paid-date').value) {
                    document.getElementById('form-paid-date').value = new Date().toISOString().split('T')[0];
                }
            } else {
                container.classList.add('hidden');
            }
        }

        // Save Item Form Submission
        function saveItem(event) {
            event.preventDefault();

            const id = document.getElementById('form-id').value;
            const title = document.getElementById('form-title').value.trim();
            const payee = document.getElementById('form-payee').value.trim();
            const amount = Number(document.getElementById('form-amount').value);
            const dueDate = document.getElementById('form-due-date').value;
            const paymentMethod = document.getElementById('form-method').value;
            const isPaid = document.getElementById('form-is-paid').checked;
            const paidDate = isPaid ? document.getElementById('form-paid-date').value : null;

            if (id) {
                // Update existing
                const index = items.findIndex(i => i.id === id);
                if (index !== -1) {
                    items[index] = { ...items[index], title, payee, amount, dueDate, paymentMethod, isPaid, paidDate };
                }
                showToast('項目を更新しました');
            } else {
                // Create new
                const newItem = {
                    id: 'item-' + Date.now(),
                    title,
                    payee,
                    amount,
                    dueDate,
                    paymentMethod,
                    isPaid,
                    paidDate,
                    createdAt: new Date().toISOString()
                };
                items.unshift(newItem);
                showToast('新しい支払いを追加しました');
            }

            saveToStorage();
            render();
            closeModal();
        }

        // Delete Item
        function deleteItem(id, event) {
            if (event) event.stopPropagation();
            if (confirm('この支払い項目を削除してもよろしいですか？')) {
                items = items.filter(i => i.id !== id);
                saveToStorage();
                render();
                showToast('削除しました');
            }
        }

        // Helper Functions
        function showOcrLoading(show) {
            const modal = document.getElementById('ocr-loading-modal');
            if (show) modal.classList.remove('hidden');
            else modal.classList.add('hidden');
        }

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => {
                    const base64 = reader.result.split(',')[1];
                    resolve(base64);
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        function formatDate(dateStr) {
            if (!dateStr) return '';
            const d = new Date(dateStr);
            return `${d.getMonth() + 1}/${d.getDate()}`;
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>"']/g, function(m) {
                return {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#039;'
                }[m];
            });
        }

        function showToast(msg, type = 'success') {
            const toast = document.getElementById('toast');
            const icon = document.getElementById('toast-icon');
            const message = document.getElementById('toast-message');

            message.textContent = msg;
            if (type === 'error') {
                icon.className = 'fa-solid fa-circle-exclamation text-red-400';
            } else {
                icon.className = 'fa-solid fa-circle-check text-emerald-400';
            }

            toast.classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2500);
        }
    </script>
</body>
</html>
